<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crafting Apps</title>
<link rel="stylesheet" href="../__picode/tokens.css">
<link rel="stylesheet" href="apps.css">
</head>
<body class="pc-page">
<main class="shell">
  <header class="page-head">
    <div><h1>Crafting Apps</h1><p class="pc-muted subtitle">Documents, images and motion</p></div>
    <div class="workspace-controls" data-align-row>
      <label for="workspace">Workspace</label><select id="workspace" class="pc-select" aria-label="Workspace"><option>Loading…</option></select>
      <button id="refresh" class="pc-button" type="button">Refresh</button>
    </div>
  </header>
  <div id="problem" class="notice" role="status" hidden><span id="problem-text"></span><button id="retry" class="pc-button" type="button">Retry</button></div>
  <div id="blocked" class="notice" role="status" hidden><span id="blocked-text"></span><button id="settings" class="pc-button" type="button">Extension settings</button></div>
  <section id="file-banner" class="notice file-banner" hidden aria-label="Selected file"><div><strong id="file-name"></strong><span id="file-description" class="pc-muted"></span></div><button id="file-action" class="pc-button primary" type="button">Open file</button><span id="file-message" role="status"></span></section>
  <section id="surface" class="surface" aria-label="Apps">
    <div class="toolbar">
      <input id="search" class="pc-input" type="search" placeholder="Search apps or tasks…" aria-label="Search apps or tasks">
      <div class="filters" data-align-row><select id="category" class="pc-select" aria-label="Filter by purpose"><option value="All">All purposes</option><option>Documents</option><option>Images</option><option>Motion</option></select>
      <select id="availability" class="pc-select" aria-label="Filter by status"><option value="all">All states</option><option value="installed">Installed</option><option value="connected">Connected</option><option value="attention">Needs attention</option></select></div>
    </div>
    <div class="split" id="split">
      <nav id="catalog" class="catalog" aria-label="Choose an app"><div class="loading" aria-label="Loading apps"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></nav>
      <section id="detail" class="detail" aria-label="Selected app"><p class="pc-muted">Choose an app to see its actions.</p></section>
    </div>
    <footer><span id="freshness" role="status">Checking apps…</span><span>Native apps on this computer</span></footer>
  </section>
</main>
<script src="domain.js"></script>
<script src="apps.js"></script>
</body>
</html>
